<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .box { fill: none; stroke: #4a5568; stroke-width: 1.5; rx: 6; }
    .built { stroke: #2b6cb0; stroke-width: 2.5; }
    .later { stroke-dasharray: 5 4; stroke: #718096; }
    .t { font-size: 14px; fill: #1a202c; }
    .h { font-size: 15px; font-weight: 600; fill: #1a202c; }
    .s { font-size: 11.5px; fill: #4a5568; }
    .m { font-size: 12.5px; fill: #2d3748; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .he { font-size: 13px; fill: #2d3748; }
    .lbl { font-size: 10.5px; fill: #718096; letter-spacing: .06em; }
    .arr { stroke: #4a5568; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .tag { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; }
    @media (prefers-color-scheme: dark) {
      .t, .h { fill: #f7fafc; } .s, .m, .he { fill: #cbd5e0; } .lbl { fill: #a0aec0; }
      .box { stroke: #a0aec0; } .arr { stroke: #a0aec0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="24" y="32" class="h" font-size="17">Hebrew code-switching for TTS — three passes</text>
  <text x="24" y="52" class="s">Pass 1 is this repository. Passes 2 and 3 are planned; the interface between them is fixed.</text>

  <!-- input -->
  <rect x="24" y="78" width="932" height="52" class="box"/>
  <text x="40" y="100" class="lbl">SCRIPT LINE</text>
  <text x="40" y="119" class="m">I need to go to Bituach Leumi before the makolet closes.</text>

  <path d="M490 130 L490 156" class="arr"/>

  <!-- pass 1 -->
  <rect x="24" y="160" width="932" height="92" class="box built"/>
  <text x="40" y="182" class="tag" fill="#2b6cb0">PASS 1 · DETECT · THIS REPO</text>
  <text x="40" y="203" class="t">Token classifier — which tokens are Hebrew written in Latin characters?</text>
  <text x="40" y="224" class="m">I need to go to <tspan font-weight="700" fill="#2b6cb0">Bituach Leumi</tspan> before the <tspan font-weight="700" fill="#2b6cb0">makolet</tspan> closes.</text>
  <text x="40" y="243" class="s">xlm-roberta-base, BIO tags · lexicon lookup for known terms · nothing off the shelf does this</text>

  <path d="M490 252 L490 278" class="arr"/>

  <!-- pass 2 -->
  <rect x="24" y="282" width="932" height="92" class="box later"/>
  <text x="40" y="304" class="tag" fill="#718096">PASS 2 · CONVERT TO HEBREW SCRIPT</text>
  <text x="40" y="325" class="t">Each span rendered in Hebrew characters</text>
  <text x="40" y="346" class="he">Bituach Leumi → ביטוח לאומי     ·     makolet → מכולת</text>
  <text x="40" y="365" class="s">Curated lexicon first · TaatikNet (ByT5, word-level) as fallback · unknown spans stay English</text>

  <path d="M490 374 L490 400" class="arr"/>

  <!-- pass 3 -->
  <rect x="24" y="404" width="932" height="132" class="box later"/>
  <text x="40" y="426" class="tag" fill="#718096">PASS 3 · NORMALISE PER TTS PROVIDER</text>
  <text x="40" y="446" class="t">Deterministic — not a model. Syntax depends entirely on the engine.</text>

  <rect x="40" y="458" width="440" height="66" class="box"/>
  <text x="54" y="477" class="lbl">CHATTERBOX — NO INLINE TAGS</text>
  <text x="54" y="496" class="m" font-size="11.5">[("I need to go to ", "en"),</text>
  <text x="54" y="512" class="m" font-size="11.5"> ("ביטוח לאומי", "he"), …]  → concat</text>

  <rect x="500" y="458" width="440" height="66" class="box"/>
  <text x="514" y="477" class="lbl">SSML ENGINES — INLINE</text>
  <text x="514" y="496" class="m" font-size="11.5">I need to go to</text>
  <text x="514" y="512" class="m" font-size="11.5">&lt;lang xml:lang="he-IL"&gt;ביטוח לאומי&lt;/lang&gt;</text>
</svg>
